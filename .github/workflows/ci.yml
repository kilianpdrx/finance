name: CI

# Fait tourner la suite de tests à chaque push. C'est ce qui rend « ne pas
# publier une migration cassée » vérifiable plutôt que théorique : les données
# des utilisateurs ne peuvent pas revenir en arrière (les migrations ne sont
# jouées que vers l'avant).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  # Les tests de bout en bout tournent contre un VRAI backend, sur un répertoire
  # de données jetable (FINANCE_DATA_DIR) et sans réseau (FINANCE_OFFLINE).
  # Les anciennes specs simulaient les réponses de l'API : cette copie parallèle
  # du contrat a dérivé sans que rien n'échoue. Ici, une rupture de contrat fait
  # échouer le job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      # Le rapport (avec les traces) est ce qui rend un échec en CI diagnosticable
      # sans rejouer la suite localement.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Les images doivent rester constructibles même sans tag : sinon on ne le
  # découvre qu'au moment de publier une version.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
