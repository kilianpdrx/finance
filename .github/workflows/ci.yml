name: CI

# Fait tourner la suite de tests à chaque push. C'est ce qui rend « ne pas
# publier une migration cassée » vérifiable plutôt que théorique : les données
# des utilisateurs ne peuvent pas revenir en arrière (les migrations ne sont
# jouées que vers l'avant).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  # Les tests de bout en bout tournent contre un VRAI backend, sur un répertoire
  # de données jetable (FINANCE_DATA_DIR) et sans réseau (FINANCE_OFFLINE).
  # Les anciennes specs simulaient les réponses de l'API : cette copie parallèle
  # du contrat a dérivé sans que rien n'échoue. Ici, une rupture de contrat fait
  # échouer le job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      # Le rapport (avec les traces) est ce qui rend un échec en CI diagnosticable
      # sans rejouer la suite localement.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Construire l'image ne prouve rien : il faut la LANCER. Ce job démarre la pile
  # avec `release/docker-compose.yml` — le fichier exact que reçoivent vos proches —
  # donc il teste aussi le câblage (proxy web→backend, volume, ports), pas seulement
  # la compilation. Sans lui, un point d'entrée cassé arrive chez eux avant chez vous.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # `load: true` charge l'image dans le démon local — impossible de la lancer
      # sinon. Mono-architecture ici ; le multi-arch est vérifié à la publication.
      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: finance-backend:ci
      - name: Construire l'image web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          tags: finance-web:ci

      - name: Démarrer la pile comme le ferait un utilisateur
        working-directory: release
        env:
          IMAGE_PREFIX: finance
          TAG: ci
        run: docker compose up -d

      - name: Attendre que l'application réponde
        working-directory: release
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "l'application répond"; exit 0
            fi
            sleep 2
          done
          echo "::error::pas de réponse sur 127.0.0.1:3000 après 120 s"
          docker compose logs --no-color
          exit 1

      - name: Vérifier la version, l'amorçage et l'isolation réseau
        working-directory: release
        run: |
          set -euo pipefail

          # 1. L'API de version répond (c'est elle qui alimente « À propos »).
          version=$(curl -fsS http://127.0.0.1:3000/api/system/version)
          echo "version: $version"
          echo "$version" | grep -q '"version"'

          # 2. Une base neuve est amorcée : sans cela l'utilisateur arrive sur une
          #    application sans catégories et sans catégorisation automatique.
          count=$(curl -fsS http://127.0.0.1:3000/api/categories | grep -o '"id"' | wc -l)
          echo "catégories amorcées : $count"
          test "$count" -ge 14

          # 3. Le backend ne doit PAS être publié sur la machine (invariant : seul
          #    le web est exposé, en 127.0.0.1 uniquement). Un `ports:` ajouté par
          #    inadvertance sur le backend donnerait un accès total sans mot de passe.
          if curl -fsS --max-time 5 http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
            echo "::error::le backend est joignable sur 127.0.0.1:8000 — il ne doit pas être publié"
            exit 1
          fi
          echo "backend non publié"

          # 4. Le port du web est bien restreint à la boucle locale.
          docker compose port web 3000 | grep -q '^127.0.0.1:' \
            || { echo "::error::le web n'est pas restreint à 127.0.0.1"; exit 1; }
          echo "web restreint à 127.0.0.1"

      - name: Journaux en cas d'échec
        if: failure()
        working-directory: release
        run: docker compose logs --no-color

      - name: Arrêter la pile
        if: always()
        working-directory: release
        run: docker compose down -v
