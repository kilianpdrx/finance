[alembic]
# For the `alembic` CLI only. The app runs the migrations itself at startup
# (database.sync_schema) with settings given in code (database._alembic_config):
# a '%' in the install path broke this file's interpolation, and Alembic reads
# it in the locale encoding, which an app opened from the Finder lacks.
#
# ASCII ONLY all the same (tests/test_schema_migration.py pins it): one accent
# here once made the desktop app skip every migration, silently.
#
# Paths relative to this file (%(here)s), not to the working directory.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Without it Alembic warns on every run that it falls back to its old way of
# splitting prepend_sys_path (spaces, commas AND colons).
path_separator = os
sqlalchemy.url = sqlite:///data/finance.db

[post_write_hooks]

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
