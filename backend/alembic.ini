[alembic]
# ASCII ONLY in this file. Alembic reads it in the system's locale encoding
# (encoding="locale", which Python's UTF-8 mode does not override), and an app
# opened from the Finder or the Start menu has no locale: ASCII on macOS. One
# accent here and the desktop app skipped every migration, silently
# (tests/test_schema_migration.py pins it).
#
# Paths relative to this file (%(here)s), not to the working directory: the app
# runs the migrations itself at startup (database.sync_schema), and the desktop
# app starts from another folder than the one they live in.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Without it Alembic warns on every run that it falls back to its old way of
# splitting prepend_sys_path (spaces, commas AND colons).
path_separator = os
sqlalchemy.url = sqlite:///data/finance.db

[post_write_hooks]

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
