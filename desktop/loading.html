<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Finance</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #18181b; --muted: #71717a; --brand: #6366f1; --track: #e4e4e7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --track: #27272a; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: var(--bg); color: var(--fg);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; cursor: default;
    }
    .ring {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--track); border-top-color: var(--brand);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 3s; } }
    h1 { margin: 0; font-size: 17px; font-weight: 600; }
    p { margin: 0; color: var(--muted); font-size: 13px; text-align: center; max-width: 320px; }
  </style>
</head>
<body>
  <div class="ring" role="progressbar" aria-label="Démarrage"></div>
  <h1>Démarrage…</h1>
  <p>La première ouverture peut prendre jusqu'à une minute.</p>
</body>
</html>
